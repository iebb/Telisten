name: Android APKs

on:
  push:
    branches: [master]
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android-apks.yml', '.env.example']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apks.yml', '.env.example']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          printf 'ANDROID_VERSION_CODE=%s\n' "$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Fetch checksum-verified TDLib
        run: ./scripts/setup-tdlib.sh

      - name: Build, test, and lint
        env:
          # Pull requests never receive application credentials, including same-repo PRs.
          TELEGRAM_API_ID: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/android-v')) && secrets.TELEGRAM_API_ID || '' }}
          TELEGRAM_API_HASH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/android-v')) && secrets.TELEGRAM_API_HASH || '' }}
        run: |
          if [[ -z "$TELEGRAM_API_ID" || -z "$TELEGRAM_API_HASH" ]]; then
            echo 'Telegram credentials are absent; APKs will support demo and offline use.' >> "$GITHUB_STEP_SUMMARY"
          fi
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug

      - name: Sign and package installable APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/android-v')) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/android-v')) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/android-v')) && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/android-v')) && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          ./scripts/package-apks.sh
          cat dist/BUILD.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: telisten-apks-${{ github.run_number }}-${{ github.sha }}
          path: android/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
